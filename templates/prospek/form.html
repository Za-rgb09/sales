{% extends 'base.html' %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
    /* Variabel Tema Cybertron */
    .cyber-form-wrapper {
        --cb-primary: #ef233c;      /* Autobot Red */
        --cb-secondary: #00b4d8;    /* Energon Cyan */
        --cb-bg-dark: #070a10;
        --cb-panel: #0e131f;
        --cb-input-bg: #080b12;
        --cb-border: rgba(0, 180, 216, 0.3);
        --cb-glow: rgba(239, 35, 60, 0.45);
        --cb-glow-cyan: rgba(0, 180, 216, 0.35);

        background-color: var(--cb-bg-dark);
        background-image: 
            linear-gradient(rgba(0, 180, 216, 0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 180, 216, 0.04) 1px, transparent 1px);
        background-size: 32px 32px;
        color: #f1f5f9;
        font-family: 'Rajdhani', sans-serif;
        min-height: 85vh;
        border-radius: 6px;
        border: 1px solid var(--cb-border);
        box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.85);
    }

    /* Header Judul Form */
    .cyber-form-header {
        background: linear-gradient(90deg, rgba(14, 19, 31, 0.95), rgba(0, 180, 216, 0.12));
        border-left: 5px solid var(--cb-secondary);
        border-bottom: 1px solid var(--cb-border);
        padding: 18px 25px;
        margin-bottom: 28px;
        clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
    }

    .cyber-tag {
        font-family: 'Share Tech Mono', monospace;
        font-size: 0.75rem;
        color: var(--cb-secondary);
        letter-spacing: 2px;
        display: block;
        margin-bottom: 4px;
    }

    .cyber-form-header h3 {
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        font-size: 1.6rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin: 0;
        color: #ffffff;
        text-shadow: 0 0 12px var(--cb-glow-cyan);
    }

    /* Panel Utama Form */
    .cyber-form-card {
        background: var(--cb-panel);
        border: 1px solid var(--cb-border);
        border-top: 3px solid var(--cb-primary);
        max-width: 760px;
        clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.65);
        overflow: hidden;
    }

    .cyber-card-topbar {
        background: rgba(239, 35, 60, 0.08);
        padding: 10px 24px;
        border-bottom: 1px solid var(--cb-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: 'Share Tech Mono', monospace;
        font-size: 0.78rem;
        color: var(--cb-secondary);
        letter-spacing: 1.5px;
    }

    .cyber-form-body {
        padding: 30px 32px;
    }

    /* Label Form */
    .cyber-label {
        font-family: 'Orbitron', sans-serif;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--cb-secondary);
        margin-bottom: 8px;
        display: block;
    }

    /* Styling Otomatis untuk semua Input, Select, dan Textarea bawaan Django */
    .cyber-field-group input[type="text"],
    .cyber-field-group input[type="email"],
    .cyber-field-group input[type="number"],
    .cyber-field-group input[type="tel"],
    .cyber-field-group input[type="url"],
    .cyber-field-group input[type="date"],
    .cyber-field-group select,
    .cyber-field-group textarea {
        width: 100%;
        background-color: var(--cb-input-bg) !important;
        color: #f8fafc !important;
        font-family: 'Rajdhani', sans-serif;
        font-size: 1.1rem;
        font-weight: 600;
        padding: 12px 16px;
        border: 1px solid rgba(0, 180, 216, 0.35) !important;
        border-left: 3px solid var(--cb-secondary) !important;
        border-radius: 0 !important;
        clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
        transition: all 0.25s ease;
        outline: none;
    }

    .cyber-field-group input:focus,
    .cyber-field-group select:focus,
    .cyber-field-group textarea:focus {
        border-color: var(--cb-primary) !important;
        border-left-color: var(--cb-primary) !important;
        box-shadow: 0 0 15px var(--cb-glow) !important;
        background-color: #0b101b !important;
    }

    .cyber-field-group select option {
        background-color: #0e131f;
        color: #f8fafc;
    }

    /* Pesan Error Validasi Django */
    .cyber-error {
        display: block;
        margin-top: 6px;
        font-family: 'Share Tech Mono', monospace;
        font-size: 0.82rem;
        color: #ff4d6d;
        letter-spacing: 0.5px;
    }

    /* Area Tombol Bawah */
    .cyber-form-actions {
        margin-top: 32px;
        padding-top: 20px;
        border-top: 1px dashed rgba(255, 255, 255, 0.12);
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
    }

    .btn-cyber-save {
        font-family: 'Orbitron', sans-serif;
        font-size: 0.85rem;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 13px 28px;
        background: linear-gradient(135deg, var(--cb-primary), #9b111e);
        color: #ffffff;
        border: none;
        cursor: pointer;
        clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        box-shadow: 0 0 18px var(--cb-glow);
        transition: all 0.25s ease;
    }

    .btn-cyber-save:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 0 26px var(--cb-primary);
        filter: brightness(1.15);
    }

    .btn-cyber-back {
        font-family: 'Orbitron', sans-serif;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 13px 24px;
        background: rgba(0, 180, 216, 0.1);
        color: var(--cb-secondary) !important;
        border: 1px solid var(--cb-secondary);
        text-decoration: none;
        clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        transition: all 0.25s ease;
        display: inline-flex;
        align-items: center;
    }

    .btn-cyber-back:hover {
        background: rgba(0, 180, 216, 0.22);
        box-shadow: 0 0 15px var(--cb-glow-cyan);
        color: #ffffff !important;
    }
</style>

<div class="container-fluid py-4 px-4 cyber-form-wrapper">

    <!-- Header Judul Dinamis ({{ judul }}) -->
    <div class="cyber-form-header">
        <span class="cyber-tag">// CYBERTRON DATA TRANSMISSION MODULE</span>
        <h3>{{ judul }}</h3>
    </div>

    <!-- Kartu Form -->
    <div class="cyber-form-card">
        <div class="cyber-card-topbar">
            <span>◈ INPUT PARAMETER CONSOLE</span>
            <span>STATUS: READY</span>
        </div>

        <div class="cyber-form-body">

            <form method="POST">
                {% csrf_token %}

                {% for field in form %}
                    <div class="mb-4 cyber-field-group">
                        <label class="cyber-label" for="{{ field.id_for_label }}">
                            ▸ {{ field.label }}
                        </label>

                        {{ field }}

                        {% for error in field.errors %}
                            <small class="cyber-error">[!] ERROR: {{ error }}</small>
                        {% endfor %}
                    </div>
                {% endfor %}

                <div class="cyber-form-actions">
                    <button type="submit" class="btn-cyber-save">
                        ⚡ Simpan Data
                    </button>

                    <a href="{% url 'prospek:index' %}" class="btn-cyber-back">
                        ◀ Kembali
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
