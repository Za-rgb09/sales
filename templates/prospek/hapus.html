{% extends 'base.html' %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
    /* Variabel Tema Cybertron Alert */
    .cyber-delete-wrapper {
        --cb-danger: #ff1e42;
        --cb-danger-dark: #8a001a;
        --cb-secondary: #00b4d8;
        --cb-bg-dark: #070a10;
        --cb-panel: #0f121a;
        --cb-glow-red: rgba(255, 30, 66, 0.55);
        --cb-glow-cyan: rgba(0, 180, 216, 0.35);

        background-color: var(--cb-bg-dark);
        background-image: 
            radial-gradient(circle at center, rgba(255, 30, 66, 0.08) 0%, transparent 65%),
            linear-gradient(rgba(255, 30, 66, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 30, 66, 0.03) 1px, transparent 1px);
        background-size: 100% 100%, 30px 30px, 30px 30px;
        color: #f8fafc;
        font-family: 'Rajdhani', sans-serif;
        min-height: 82vh;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        border: 1px solid rgba(255, 30, 66, 0.25);
        box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9);
    }

    /* Kartu Peringatan Utama */
    .cyber-alert-card {
        width: 100%;
        max-width: 580px;
        background: var(--cb-panel);
        border: 1px solid rgba(255, 30, 66, 0.45);
        border-top: 4px solid var(--cb-danger);
        box-shadow: 0 0 35px rgba(255, 30, 66, 0.25);
        clip-path: polygon(22px 0, calc(100% - 22px) 0, 100% 22px, 100% calc(100% - 22px), calc(100% - 22px) 100%, 22px 100%, 0 calc(100% - 22px), 0 22px);
        overflow: hidden;
    }

    /* Baris Peringatan Berkedip di Atas */
    .cyber-alert-topbar {
        background: repeating-linear-gradient(
            45deg,
            rgba(255, 30, 66, 0.18),
            rgba(255, 30, 66, 0.18) 12px,
            rgba(0, 0, 0, 0.4) 12px,
            rgba(0, 0, 0, 0.4) 24px
        );
        border-bottom: 1px solid rgba(255, 30, 66, 0.4);
        padding: 10px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: 'Share Tech Mono', monospace;
        font-size: 0.78rem;
        color: #ff4d6d;
        letter-spacing: 2px;
    }

    .alert-blink {
        animation: blinkAlert 1.2s infinite;
        font-weight: bold;
    }

    .cyber-alert-body {
        padding: 36px 34px;
        text-align: center;
    }

    /* Ikon Peringatan Segitiga Cybertron */
    .warning-emblem {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 68px;
        height: 68px;
        margin-bottom: 18px;
        background: rgba(255, 30, 66, 0.12);
        border: 2px solid var(--cb-danger);
        color: var(--cb-danger);
        font-family: 'Orbitron', sans-serif;
        font-size: 2rem;
        font-weight: 900;
        box-shadow: 0 0 20px var(--cb-glow-red);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }

    .cyber-alert-body h4 {
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        font-size: 1.65rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #ffffff;
        text-shadow: 0 0 15px var(--cb-glow-red);
        margin-bottom: 14px;
    }

    .cyber-alert-body p {
        font-size: 1.15rem;
        color: #cbd5e1;
        line-height: 1.6;
        margin-bottom: 28px;
    }

    /* Sorotan Nama Target Prospek */
    .target-highlight {
        display: inline-block;
        margin-top: 6px;
        padding: 4px 14px;
        font-family: 'Orbitron', sans-serif;
        font-size: 1.05rem;
        font-weight: 800;
        color: #ff4d6d;
        background: rgba(255, 30, 66, 0.14);
        border: 1px solid rgba(255, 30, 66, 0.45);
        letter-spacing: 1px;
    }

    /* Tombol Aksi */
    .cyber-alert-actions {
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
        padding-top: 10px;
    }

    .btn-cyber-purge {
        font-family: 'Orbitron', sans-serif;
        font-size: 0.85rem;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 13px 28px;
        background: linear-gradient(135deg, var(--cb-danger), var(--cb-danger-dark));
        color: #ffffff;
        border: none;
        cursor: pointer;
        clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        box-shadow: 0 0 20px var(--cb-glow-red);
        transition: all 0.25s ease;
    }

    .btn-cyber-purge:hover {
        transform: translateY(-2px) scale(1.03);
        box-shadow: 0 0 30px var(--cb-danger);
        filter: brightness(1.15);
    }

    .btn-cyber-abort {
        font-family: 'Orbitron', sans-serif;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 13px 26px;
        background: rgba(0, 180, 216, 0.1);
        color: var(--cb-secondary) !important;
        border: 1px solid var(--cb-secondary);
        text-decoration: none;
        clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        transition: all 0.25s ease;
        display: inline-flex;
        align-items: center;
    }

    .btn-cyber-abort:hover {
        background: rgba(0, 180, 216, 0.25);
        box-shadow: 0 0 16px var(--cb-glow-cyan);
        color: #ffffff !important;
    }

    @keyframes blinkAlert {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
    }
</style>

<div class="container py-5 cyber-delete-wrapper">

    <div class="cyber-alert-card">
        <!-- Header Garis Peringatan -->
        <div class="cyber-alert-topbar">
            <span class="alert-blink">⚠ CRITICAL WARNING // PURGE PROTOCOL</span>
            <span>SYS-DEL</span>
        </div>

        <div class="cyber-alert-body">
            <div class="warning-emblem">!</div>

            <h4>Hapus Prospek?</h4>

            <p>
                Apakah kamu yakin ingin menghapus data target berikut secara permanen dari jaringan Cybertron?<br>
                <strong class="target-highlight">{{ prospek.nama }}</strong>
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="cyber-alert-actions">
                    <button type="submit" class="btn-cyber-purge">
                        ✖ Ya, Hapus
                    </button>

                    <a href="{% url 'prospek:index' %}" class="btn-cyber-abort">
                        ◀ Batal
                    </a>
                </div>
            </form>

        </div>
    </div>

</div>

{% endblock %}
